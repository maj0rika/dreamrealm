name: living-world
description: 메모리 플래시백 + 이미지 일관성 + 오프라인 세계 진행 — "세계가 텍스트로도, 이미지로도, 시간이 흘러도 기억하고 살아간다"
created_at: "2026-04-03"
ambiguity_score: 0.18

goal:
  primary: >
    세계의 기억력을 텍스트·비주얼·시간 세 축으로 완성한다.
    (1) 벡터 메모리 기반 플래시백으로 과거를 회상하고,
    (2) 장소별 시각 앵커+시드 고정으로 이미지 일관성을 확보하며,
    (3) 부재 시간에 비례한 확률적 사건 생성으로 오프라인에도 살아있는 세계를 구현한다.
  motivation: >
    현재 문제: (1) 임베딩 코드는 있으나 플래시백 UI 없음 — 기억하는 세계 차별점 미완성.
    (2) 매 턴 이미지가 독립 생성되어 같은 나무에 다가가면 다른 나무가 됨.
    (3) 접속 안 하면 세계가 멈춤 — "살아있는 세계" 약속 미이행.
  success_metric: >
    1) 중요 이벤트가 있었던 장소 재방문 시 과거 이미지 비침 + 회상 텍스트 표시
    2) 같은 장소에서 연속 턴 진행 시 이미지 톤/핵심 요소가 일관됨
    3) 1시간+ 부재 후 복귀 시 타임라인에 세계 변화 사건(최대 3~5개)이 표시됨
    4) 부재 기간이 길수록 큰 사건 확률이 높아지되, 항상 발생하지는 않음

constraints:
  - id: C1
    description: "FLUX.1 Schnell + Replicate 유지 ($0.003/장), 모델 변경 없음"
  - id: C2
    description: "이미지 생성은 기존 비동기 파이프라인 유지 — 턴 응답 블로킹 금지"
  - id: C3
    description: "오프라인 진행은 재접속 시 역산 방식 — 백그라운드 크론 없음"
  - id: C4
    description: "사건 생성은 확률 기반 — 기간↑ = 큰 사건 확률↑, 보장은 아님"
  - id: C5
    description: "생성된 사건은 세계관·NPC 행동규칙과 납득 가능해야 함"
  - id: C6
    description: "복귀 타임라인 사건은 최대 3~5개로 압축 — 핵심만 추려서 흥미 유발"
  - id: C7
    description: "OpenAI text-embedding-3-small 임베딩 유지"
  - id: C8
    description: "한국어 전용 출력 규칙 유지 (image_prompt만 영문)"

acceptance_criteria:
  # ── 메모리 플래시백 ──
  - id: AC1
    description: "벡터 메모리 검색이 턴 처리 컨텍스트에 실제 반영된다"
    details: >
      현재 context-builder.ts에 벡터 검색 코드가 있으나 실제 동작 검증 필요.
      유저 입력 → 임베딩 → memory_embeddings에서 cosine similarity Top-5 조회 →
      narrator 컨텍스트에 포함. importance ≥ 5 이벤트만 임베딩 생성.
    test_strategy: "중요 이벤트 발생 후 관련 키워드 입력 시 컨텍스트에 해당 메모리 포함 확인"
    priority: must

  - id: AC2
    description: "중요 이벤트 장소 재방문 시 플래시백이 표시된다 (이미지+텍스트)"
    details: >
      트리거: 이동한 장소에 importance ≥ 5 이벤트가 있을 때.
      이미지: 해당 이벤트 턴의 이미지가 반투명으로 잠깐(2~3초) 비쳤다 현재 이미지로 전환.
      텍스트: narrator 컨텍스트에 플래시백 정보 포함 → AI가 "문득 기억이 떠오른다..." 스타일로 서술.
      한 번 표시된 플래시백은 events.flashback_shown = true로 마킹 (중복 방지).
    test_strategy: "importance ≥ 5 이벤트 장소 재방문 시 회상 이미지 + 텍스트 노출, 재방문 시 미노출 확인"
    priority: must

  # ── 이미지 일관성 ──
  - id: AC3
    description: "장소별 시각 앵커가 DB에 저장되고 이미지 생성에 반영된다"
    details: >
      locations 테이블에 visual_anchor TEXT 컬럼 추가 (마이그레이션).
      월드 생성 시 AI가 각 장소의 시각 앵커를 생성:
      "이끼 낀 고대 참나무가 중앙에 선 석조 광장, 붉은 기와 지붕 건물들, 자갈길" 등
      50~80 단어의 영문 고정 묘사. 한 번 생성되면 변경되지 않음.
    test_strategy: "월드 생성 후 각 location에 visual_anchor가 존재하고 50단어 이상인지 확인"
    priority: must

  - id: AC4
    description: "장소별 이미지 시드가 고정되어 일관된 이미지를 생성한다"
    details: >
      locations 테이블에 image_seed INTEGER 컬럼 추가.
      월드 생성 시 각 장소에 랜덤 시드 할당 (고정).
      이미지 생성 시 Replicate API에 seed 파라미터로 전달.
      동일 장소에서 유사 프롬프트 → 유사 이미지 결과.
    test_strategy: "같은 장소에서 2회 이미지 생성 시 시각적 일관성 확인 (동일 시드)"
    priority: must

  - id: AC5
    description: "이미지 프롬프트가 3층 구조로 생성된다"
    details: >
      Layer 1 — 시각 앵커 (location.visual_anchor, 고정)
      Layer 2 — 가변 요소 (시간대, 날씨, 등장인물, 카메라 앵글, 분위기)
      Layer 3 — 아트 스타일 접미사 (world.art_style, 고정)
      narrator가 image_prompt 생성 시 Layer 2만 생성,
      시스템이 Layer 1 + Layer 2 + Layer 3을 조합하여 최종 프롬프트 구성.
    test_strategy: "생성된 최종 image_prompt에 visual_anchor + 가변 요소 + art_style이 모두 포함되는지 확인"
    priority: must

  # ── 오프라인 세계 진행 ──
  - id: AC6
    description: "1시간+ 부재 후 복귀 시 시간 경과 사건이 생성된다"
    details: >
      resume API에서 마지막 턴 시각과 현재 시각의 차이 계산.
      1시간 미만 → 변화 없음 (기존 resume 동작).
      1시간+ → AI에게 경과 시간 + 월드 상태 + NPC 행동규칙 전달 →
      확률 기반으로 사건 생성. 생성된 사건은 DB에 반영 (위치 이동, 관계 변화, 이벤트 등).
    test_strategy: "마지막 턴 시각을 6시간 전으로 조작 후 resume 시 사건 생성 확인"
    priority: must

  - id: AC7
    description: "사건 생성이 확률 기반이며 부재 기간에 비례한다"
    details: >
      확률 모델:
      - 1~6시간: 소규모 변화 확률 높음 (NPC 이동, 날씨), 중규모 낮음, 대규모 거의 없음
      - 6~24시간: 소규모 확실, 중규모 확률 상승 (상인 입고, NPC 관계 변화)
      - 1~3일: 중규모 확실, 대규모 확률 상승 (도적 출몰, 축제, NPC 여행)
      - 3일+: 대규모 확률 높음 (전쟁, 재해, 실종) — 단, 보장 아님
      AI 프롬프트에 확률 가이드라인과 "납득 가능성" + "흥미 유발" 원칙을 명시.
      NPC behavior_rules의 goals, triggers를 참조하여 사건의 개연성 확보.
    test_strategy: "다양한 부재 시간(2h, 12h, 48h, 96h)으로 10회씩 테스트 → 사건 규모 분포 확인"
    priority: must

  - id: AC8
    description: "복귀 시 타임라인 UI로 사건을 시간순 표시한다"
    details: >
      resume 응답에 time_passage_events[] 추가.
      각 사건: { time, description, importance, entities_involved }.
      최대 3~5개로 압축 (importance 높은 순 선별).
      탐험 화면에 복귀 전용 타임라인 UI 표시 — 스크롤 가능한 카드 리스트.
      사건 확인 후 "계속 탐험하기" 버튼으로 일반 턴 루프 복귀.
      time_passage_logs 테이블에 기록.
    test_strategy: "부재 후 복귀 시 타임라인 UI 노출, 사건 카드 표시, 확인 후 정상 턴 진행 확인"
    priority: must

tech_decisions:
  - decision: "이미지 일관성은 프롬프트 앵커링 + 시드 고정 방식 (접근법 C)"
    rationale: "모델 변경 없이 $0 추가 비용으로 일관성 확보. 추후 img2img로 업그레이드 가능"
  - decision: "오프라인 진행은 재접속 시 역산 (크론/스케줄러 아님)"
    rationale: "서버 비용 $0, AI 호출은 복귀 시 1회만. 월드 수 증가에도 비용 비례하지 않음"
  - decision: "사건 확률 모델은 AI 프롬프트 레벨에서 가이드"
    rationale: "하드코딩 확률표보다 AI가 세계관 맥락을 고려해 자연스러운 사건 생성"
  - decision: "플래시백은 이미지(반투명 2~3초 비침) + 텍스트(AI 서술) 결합"
    rationale: "시각+텍스트 이중 자극으로 몰입감 극대화"
  - decision: "locations 테이블에 visual_anchor TEXT + image_seed INTEGER 컬럼 추가"
    rationale: "장소별 시각적 정체성의 원천. 마이그레이션 005로 추가"
  - decision: "narrator가 image_prompt의 가변 요소(Layer 2)만 생성, 앵커+스타일은 시스템이 조합"
    rationale: "AI가 앵커를 변형하는 것을 방지 — 일관성의 핵심"

out_of_scope:
  - "NPC 푸시 알림 (WOW 기능 2번 — 다음 Phase)"
  - "결제/플랜 차등 (Phase 10)"
  - "Cloudflare Pages 배포 (Phase 11)"
  - "img2img / IP-Adapter 기반 이미지 참조 (추후 업그레이드 옵션)"
  - "사용자 직접 이미지 프롬프트 편집"
  - "NPC 개별 초상화/캐릭터 이미지"
  - "실시간 이미지 스트리밍"
  - "i18n 다국어 지원"

brownfield_context:
  existing_patterns:
    - "src/lib/memory/embeddings.ts — 임베딩 생성 + cosine similarity 검색 (구현 완료, 미사용)"
    - "src/lib/ai/context-builder.ts — 벡터 검색 Top-5 컨텍스트 조립 (코드 존재)"
    - "src/lib/ai/state-extractor.ts — AI 응답 → DB 상태 변경 추출 (확장 대상)"
    - "src/lib/ai/image-generator.ts — Replicate FLUX.1 Schnell 호출 (seed 파라미터 추가 필요)"
    - "src/lib/ai/prompts/narrator.ts — 프롬프트 수정 대상 (3층 구조 + 플래시백 컨텍스트)"
    - "src/app/api/worlds/[id]/resume/route.ts — 세션 복원 (시간 경과 로직 추가 대상)"
    - "src/app/(app)/world/[id]/page.tsx — 탐험 UI (타임라인 + 플래시백 UI 추가 대상)"
    - "supabase/migrations/ — 005 마이그레이션 추가 (visual_anchor, image_seed)"
    - "events.flashback_shown BOOLEAN — 이미 스키마에 존재, 활용 대상"
    - "time_passage_logs 테이블 — 이미 스키마에 존재, 활용 대상"
  style_conventions:
    - "서버 컴포넌트 기본, 'use client'는 필요한 곳에만"
    - "Zod 입력 검증, DB 쿼리는 lib/db/ 리포지토리 분리"
    - "AI 프롬프트는 lib/ai/prompts/에 분리"
    - "비동기 이미지 생성 + 폴링 패턴"
    - "한국어 UI, 코드/변수명 영문"
